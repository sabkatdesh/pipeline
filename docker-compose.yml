services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside compose the DB host is "db"; keep the password in sync with the db service.
      DATABASE_URL: postgresql+asyncpg://pipeline:${DB_PASSWORD:-password}@db:5432/pipeline
      RAG_BM25_INDEX_PATH: /app/data/bm25_index.pkl
      RAG_GRAPH_PATH: /app/data/concept_graph.pkl
      EMBEDDING_CACHE_DIR: /app/data/models
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
